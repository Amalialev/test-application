services:
  - type: web
    name: shiatsu-clinic
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: clinic-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD
        sync: false
